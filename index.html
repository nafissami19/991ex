<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>fx-991EX ClassWiz (web re-creation)</title>
  <meta name="theme-color" content="#1c2a33">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="css/calculator.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <img src="assets/icons/icon-192.png" alt="" class="brand-icon">
      <span>fx-991EX <small>web re-creation</small></span>
    </div>
    <nav class="tools">
      <button id="btnPopout" type="button" title="Open the LCD in its own window">Pop-out LCD</button>
      <button id="btnKeyLog" type="button" aria-pressed="false" title="Show the list of pressed keys">Key log</button>
      <button id="btnHelp" type="button" aria-pressed="false" title="PC keyboard shortcuts">Shortcuts</button>
      <button id="btnSound" type="button" aria-pressed="false" title="Key click sound">Sound</button>
    </nav>
  </header>

  <main id="stage" class="stage">
    <div id="chassis" class="chassis">
      <canvas id="lcdStatusCanvas" class="lcd-canvas"></canvas>
      <canvas id="lcdCanvas" class="lcd-canvas"></canvas>
      <div id="keypad" class="keypad"></div>
    </div>
  </main>

  <aside id="keyLogPanel" class="panel" hidden>
    <div class="panel-head">
      <strong>Key log</strong>
      <span class="panel-actions">
        <button id="btnCopyLog" type="button">Copy as JSON array</button>
        <button id="btnClearLog" type="button">Clear</button>
      </span>
    </div>
    <ol id="keyLogList" class="key-log"></ol>
  </aside>

  <aside id="helpPanel" class="panel" hidden>
    <div class="panel-head"><strong>PC keyboard shortcuts</strong></div>
    <dl id="shortcutList" class="shortcut-list"></dl>
    <p class="panel-note">Arrow keys and DEL repeat while held.</p>
  </aside>

  <script type="module" src="js/app.js"></script>
</body>
</html>
